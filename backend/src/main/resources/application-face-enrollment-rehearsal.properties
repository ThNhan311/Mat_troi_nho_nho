# F01 simulated identity only. No camera/liveness/production rollout.
spring.flyway.locations=classpath:db/migration,classpath:db/activation-rehearsal,classpath:db/membership-rehearsal,classpath:db/member-activation-rehearsal,classpath:db/renewal-rehearsal,classpath:db/checkin-rehearsal,classpath:db/enrollment-rehearsal
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
fitcenter.account-integration.guard-verified=${ACCOUNT_INTEGRATION_GUARD_VERIFIED:false}
fitcenter.renewal.guard-verified=${RENEWAL_GUARD_VERIFIED:false}
fitcenter.member-activation.enabled=true
fitcenter.activation.enabled=true
fitcenter.activation.rehearsal=true
fitcenter.activation.test-smtp-port=${ACCOUNT_TEST_SMTP_PORT:11035}
fitcenter.membership-initial.enabled=true
fitcenter.renewal.enabled=true
fitcenter.checkin.enabled=true
fitcenter.checkin.test-adapter.enabled=true
fitcenter.checkin.guard-verified=${CHECKIN_GUARD_VERIFIED:false}
fitcenter.checkin.test-config=${CHECKIN_TEST_CONFIG:}

fitcenter.enrollment.enabled=true
fitcenter.enrollment.guard-verified=${ENROLLMENT_GUARD_VERIFIED:false}
fitcenter.enrollment.test-config=${ENROLLMENT_TEST_CONFIG:}
