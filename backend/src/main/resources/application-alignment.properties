# FitCenter - Backend/Database integration environment

spring.datasource.url=${ALIGNMENT_DB_URL:jdbc:postgresql://localhost:5434/fitcenter_verify}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA schema validation
spring.jpa.hibernate.ddl-auto=validate

# Database team migrations V1-V6
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../database/migrations
spring.flyway.validate-on-migrate=true

# Application
server.port=8082

# Development logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh