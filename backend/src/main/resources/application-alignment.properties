
# FITCENTER - DATABASE ALIGNMENT ENVIRONMENT

# PostgreSQL integration database
spring.datasource.url=jdbc:postgresql://localhost:5434/fitcenter_alignment
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Validate JPA entities against the existing database schema
spring.jpa.hibernate.ddl-auto=validate

# The database already contains Flyway migrations V1-V6.
# Do not execute the backend's old V1/V2 migration files.
spring.flyway.enabled=false

# Separate port to avoid conflicts with existing services
server.port=8082

# Display SQL during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
