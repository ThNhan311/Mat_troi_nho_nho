# Explicit test-only profile. Default profile still uses canonical V1-V6 and activation=false.
spring.flyway.locations=classpath:db/migration,classpath:db/activation-rehearsal
spring.flyway.out-of-order=false
fitcenter.activation.enabled=true
fitcenter.activation.rehearsal=true
fitcenter.activation.guard-verified=${ACTIVATION_REHEARSAL_GUARD_VERIFIED:false}
fitcenter.activation.test-smtp-port=${ACTIVATION_TEST_SMTP_PORT:11025}
