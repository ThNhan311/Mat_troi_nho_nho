components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
    LoginResponse:
      type: object
      properties:
        accessToken: &id005
          type: string
        refreshToken: *id005
        role:
          type: string
          enum:
          - MEMBER
          - PT
          - ADMIN
    Plan:
      type: object
      properties:
        id: *id001
        name: *id005
        description:
          type: string
          nullable: true
        durationDays:
          type: integer
        price:
          type: number
    Membership:
      type: object
      properties:
        id: *id001
        planId: *id001
        planName: *id005
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - SUSPENDED
          - EXPIRED
          - CANCELLED
    Trainer:
      type: object
      properties:
        id: *id001
        fullName: *id005
        bio:
          type: string
          nullable: true
        specialization:
          type: string
          nullable: true
        experienceSummary:
          type: string
          nullable: true
    Slot:
      type: object
      properties:
        id: *id001
        ptId: *id001
        startAt: *id002
        endAt: *id002
        status:
          type: string
          enum:
          - AVAILABLE
          - BOOKED
          - DISABLED
    Booking:
      type: object
      properties:
        id: *id001
        memberId: *id001
        ptId: *id001
        slotId: *id001
        startAt: *id002
        endAt: *id002
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - COMPLETED
        cancelledBy:
          type: string
          nullable: true
        cancelReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code: *id005
            message: *id005
            details:
              type: object
              additionalProperties: true
            correlationId: *id005
        timestamp: *id002
        status:
          type: integer
        message: *id005
