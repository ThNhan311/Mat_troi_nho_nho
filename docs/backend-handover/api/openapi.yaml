  /api/v1/pt/bookings/{id}/service-eligibility:
    get:
      operationId: getOwnBookingServiceEligibility
      summary: PT ACTIVE kiểm tra eligibility hiện tại của booking sở hữu
      description: >-
        Ownership từ principal/profile/booking, không nhận memberId/ptId để xác định chủ sở hữu.
        PT được phép truy cập nhận 200 kể cả không eligible. Chỉ đủ điều kiện khi CONFIRMED,
        startAt<=Clock.now<endAt, account Member ACTIVE và membership ACTIVE hiện tại/phủ toàn session.
        DATE theo Asia/Ho_Chi_Minh, expiry inclusive, end session đúng midnight sau expiry được phép.
        reasonCodes đầy đủ, không trùng, theo thứ tự enum; nhóm membership chỉ kiểm coverage nếu đang hợp lệ hiện tại.
        REPEATABLE_READ read-only, query không khóa hàng; một MVCC snapshot cho actor/booking/account/membership.
        checkedAt từ server Clock trong transaction, không chứng nhận dữ liệu không đổi sau response.
        Không đọc policy hoặc áp notice/advance/count/cancellation. Không mutation/cache, không lưu startedAt/startedBy.
        Completion giữ R04, không yêu cầu GET trước đó; chưa tuyên bố frontend chặn dịch vụ end-to-end.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
