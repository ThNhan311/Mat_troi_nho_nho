openapi: 3.0.3
info:
  title: FitCenter API — bản nháp cần review
  version: face-service-integration-working-tree
  description: Baseline 1b1e323 có Booking/D01 và Web Member/PT/Admin Policy; M-01 thêm Admin tạo plan và đọc ACTIVE trên giao diện gốc. D01 snapshot không start marker, completion giữ R04. Admin account create/list thêm trên V1-V6; PT activation mặc định503; profile activation-rehearsal đã đạt HTTP/PostgreSQL/SMTP/UI trên DB test riêng với V8 ở location riêng, không production rollout. M-03 thêm counter receipt/initial Membership trên membership-rehearsal default-off; M05/M06 thêm renewal/simulator default-off trên profile guard riêng; gateway thật chưa có.
servers:
- url: http://localhost:18081
  description: Default profile, activation503
- url: http://127.0.0.1:18082
  description: Dedicated guarded PT activation rehearsal only
- url: http://localhost:18083
  description: Dedicated guarded M03 membership-rehearsal, default gate off
- url: http://localhost:18084
  description: Integrated guarded Member/PT/M03 rehearsal only, no canonical release
- url: http://127.0.0.1:18086
  description: F02 guarded test only, simulated external gallery
x-face-service-v2:
  contract: ../../../face/service_v2/openapi.json
  scope: Private loopback rehearsal; no new public Backend endpoint
  backendMode: SYNTHETIC_PROTOCOL transport only; V13 remains SIMULATED_TEST
  realAdmission: disabled; NOT_PERFORMED never PASSED
  recovery: Complete retries same operation after timeout; no blind new enrollment
  errors: [ERR_FACE_SERVICE_UNAVAILABLE, ERR_FACE_SAMPLES_REQUIRED, ERR_FACE_ADAPTER_BINDING, ERR_FACE_ATTESTATION_INVALID, ERR_FACE_REAL_ADMISSION_NOT_ENABLED]
paths:
  /api/v1/admin/members/{member}/face-enrollments:
    get:
      summary: Admin đọc hồ sơ và lịch sử enrollment theo Member UUID
      responses:
        '200':
          description: Profiles và operations; no template/capture reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentState'
        '400':
          description: ERR_VALIDATION hoặc ERR_FACE_CONSENT_REQUIRED
        '401':
          description: ERR_UNAUTHORIZED
        '403':
          description: ERR_FORBIDDEN
        '404':
          description: ERR_NOT_FOUND
        '409':
          description: ERR_IDEMPOTENCY_KEY_REUSED / ERR_FACE_ENROLLMENT_PENDING / ERR_FACE_ENROLLMENT_CONFLICT / ERR_FACE_ENROLLMENT_NOT_PENDING
        '503':
          description: ERR_FACE_ENROLLMENT_UNAVAILABLE
      tags:
      - Face enrollment (guarded simulated test)
      security:
      - bearerAuth: []
      description: ' Chỉ ADMIN ACTIVE; default503; no-store. Profile face-enrollment-rehearsal trên DB riêng; SIMULATED_TEST,
        không camera/biometric/liveness.'
    post:
      summary: Bắt đầu enrollment/re-enrollment tại gym, chưa ACTIVE
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceEnrollmentStart'
      responses:
        '201':
          description: Cùng key/payload trả cùng operation với trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollment'
        '400':
          description: ERR_VALIDATION hoặc ERR_FACE_CONSENT_REQUIRED
        '401':
          description: ERR_UNAUTHORIZED
        '403':
          description: ERR_FORBIDDEN
        '404':
          description: ERR_NOT_FOUND
        '409':
          description: ERR_IDEMPOTENCY_KEY_REUSED / ERR_FACE_ENROLLMENT_PENDING / ERR_FACE_ENROLLMENT_CONFLICT / ERR_FACE_ENROLLMENT_NOT_PENDING
        '503':
          description: ERR_FACE_ENROLLMENT_UNAVAILABLE
      tags:
      - Face enrollment (guarded simulated test)
      security:
      - bearerAuth: []
      description: ' Chỉ ADMIN ACTIVE; default503; no-store. Profile face-enrollment-rehearsal trên DB riêng; SIMULATED_TEST,
        không camera/biometric/liveness.'
    parameters:
    - in: path
      name: member
      required: true
      schema:
        type: string
        format: uuid
  /api/v1/admin/members/{member}/face-enrollments/{operation}:
    get:
      summary: Đối chiếu một operation; sai Member trả404
      responses:
        '200':
          description: Current operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollment'
        '400':
          description: ERR_VALIDATION hoặc ERR_FACE_CONSENT_REQUIRED
        '401':
          description: ERR_UNAUTHORIZED
        '403':
          description: ERR_FORBIDDEN
        '404':
          description: ERR_NOT_FOUND
        '409':
          description: ERR_IDEMPOTENCY_KEY_REUSED / ERR_FACE_ENROLLMENT_PENDING / ERR_FACE_ENROLLMENT_CONFLICT / ERR_FACE_ENROLLMENT_NOT_PENDING
        '503':
          description: ERR_FACE_ENROLLMENT_UNAVAILABLE
      tags:
      - Face enrollment (guarded simulated test)
      security:
      - bearerAuth: []
