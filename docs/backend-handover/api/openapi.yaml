      description: Public, không JWT. Khi được bật chỉ MEMBER DISABLED có Admin pending audit; OTP5phút, resend>=60giây/max5lần giờ. Email không
        đủ điều kiện vẫn202 chung, không gửi mail. Adapter hiện chỉ loopback mail test @example.invalid. Không tự replay write. Member profile/source
        Admin bắt buộc; state/grant riêng role, không dùng challenge PT. Default503; chỉ profile account-integration-rehearsal có guard15441 mới
        bật.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '202':
          description: Chỉ khi feature/schema được cho phép; không xác nhận email tồn tại
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - expiresInSeconds
                - resendAfterSeconds
                properties:
                  message:
                    type: string
                  expiresInSeconds:
                    type: integer
                    enum:
                    - 300
                  resendAfterSeconds:
                    type: integer
                    enum:
                    - 60
        '400':
          $ref: '#/components/responses/LifecycleValidation'
        '429':
          $ref: '#/components/responses/ActivationFailure'
        '503':
          $ref: '#/components/responses/ActivationFailure'
  /api/v1/auth/member-activation/verify-otp:
    post:
      operationId: verifyMemberFirstActivationOtp
      summary: MEMBER Tiêu thụ OTP, cấp grant đặt mật khẩu một lần — mặc định503, đã nghiệm thu rehearsal test
      description: OTP hết hạn khi now>=expiry; tối đa5attempts. Grant32byte random, hashSHA256 trong DB, TTL300s, không JWT. Chưa hoàn thành kích
        hoạt ở bước này. Member profile/source Admin bắt buộc; state/grant riêng role, không dùng challenge PT. Default503; chỉ profile account-integration-rehearsal
        có guard15441 mới bật.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - otp
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                  writeOnly: true
      responses:
        '200':
          description: Grant chỉ memory, không log/persist ở client
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - verificationToken
                - expiresInSeconds
                properties:
                  verificationToken:
                    type: string
                    minLength: 43
                    maxLength: 43
                  expiresInSeconds:
                    type: integer
                    enum:
                    - 300
        '400':
          $ref: '#/components/responses/ActivationFailure'
        '409':
          $ref: '#/components/responses/ActivationFailure'
        '429':
          $ref: '#/components/responses/ActivationFailure'
        '503':
          $ref: '#/components/responses/ActivationFailure'
  /api/v1/auth/member-activation/password:
    post:
      operationId: completeMemberFirstActivationPassword
      summary: MEMBER Tiêu thụ grant và đặt mật khẩu + ACTIVE nguyên tử — mặc định503, đã nghiệm thu rehearsal test
      description: Password>=8codepoints và<=72byteUTF8 theo BCrypt. User->activation row lock, Clock sau khóa; không JWT, không kích hoạt Membership/payment.
        Không replay POST khi timeout. Member profile/source Admin bắt buộc; state/grant riêng role, không dùng challenge PT. Default503; chỉ profile
        account-integration-rehearsal có guard15441 mới bật.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verificationToken
              - password
              properties:
                verificationToken:
                  type: string
                  minLength: 43
                  maxLength: 43
                  writeOnly: true
                password:
                  type: string
                  minLength: 8
                  writeOnly: true
                  description: Tối đa72byteUTF8
                  không silent truncation: null
      responses:
        '200':
          description: Login email/password riêng sau kích hoạt, không accessToken
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ACTIVE
        '400':
          $ref: '#/components/responses/ActivationFailure'
        '409':
          $ref: '#/components/responses/ActivationFailure'
        '503':
          $ref: '#/components/responses/ActivationFailure'
components:
  responses:
    AccountConflict:
      description: ERR_CONFLICT — email case insensitive đã tồn tại hoặc constraint/concurrency; không trả SQL hoặc password.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ActivationFailure:
      description: Error envelope hiện có; ERR_ACTIVATION_NOT_READY503 mặc định, ERR_TEST_MAIL_ONLY/ERR_TEST_MAIL_UNAVAILABLE503, ERR_ACTIVATION_INVALID400, ERR_OTP_EXPIRED400, ERR_OTP_ALREADY_USED409, ERR_ACTIVATION_CONFLICT409, ERR_OTP_ATTEMPT_LIMIT/ERR_OTP_RESEND_TOO_SOON/ERR_OTP_SEND_LIMIT429. Lỗi validation theo convention400.
      headers:
        Cache-Control: {schema: {type: string}, example: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LifecycleValidation:
      description: ERR_VALIDATION, UUID/input không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleUnauthorized:
      description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc account không ACTIVE khi auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleForbidden:
      description: ERR_FORBIDDEN, sai role hoặc account không ACTIVE khi recheck
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleConflict:
      description: >-
        ERR_BOOKING_NOT_CONFIRMED cho request cũ/lặp, ERR_CANCELLATION_DEADLINE,
        ERR_PT_CANCELLATION_WINDOW_CLOSED, ERR_BOOKING_NOT_ENDED, ERR_BOOKING_SLOT_CONFLICT hoặc ERR_CONFLICT cho constraint/concurrency.
        Không thay metadata lần hai, không tác động slot thuộc booking CONFIRMED khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityValidation:
      description: ERR_VALIDATION, input/body/UUID/time sai hoặc duration khác 90 phút
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityUnauthorized:
      description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc tài khoản không còn ACTIVE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityForbidden:
      description: ERR_FORBIDDEN, ADMIN/MEMBER không có quyền PT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityNotFound:
      description: ERR_NOT_FOUND, thiếu profile PT hoặc slot không có/không thuộc PT đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityConflict:
      description: ERR_CONFLICT, overlap/BOOKED/CONFIRMED/slot không chỉnh được hoặc concurrent conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    checkinKioskId:
      type: apiKey
      in: header
      name: X-Kiosk-Id
      description: Registered private service identity, rehearsal only
    checkinKioskToken:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Private service credential, never embedded in Web apps
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FaceEnrollmentStart:
      type: object
      additionalProperties: false
      required:
      - consentAccepted
      - memberVerified
      - atGym
      - consentVersion
      properties:
        consentAccepted:
          type: boolean
          enum:
          - true
        memberVerified:
          type: boolean
          enum:
          - true
        atGym:
          type: boolean
          enum:
          - true
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
          description: Nonblank version recorded by Admin; UI uses face-consent-v1. No personal identity/biometric text.
    FaceEnrollment:
      type: object
      required:
      - id
      - requestId
      - memberId
      - proposedProfileId
      - status
      - consentVersion
      - consentAt
      - startedBy
      - startedAt
      - verificationMode
      - cleanupPending
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        proposedProfileId:
          type: string
          format: uuid
        startedBy:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          nullable: true
        finalizedBy:
          type: string
          format: uuid
          nullable: true
        consentAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - FAILED
          - REVOKED
        verificationMode:
          type: string
          enum:
          - SIMULATED_TEST
        consentVersion:
          type: string
        failureCode:
          type: string
          nullable: true
        cleanupPending:
          type: boolean
          description: Includes MANUAL_REQUIRED legacy references; not a distributed-transaction success flag.
    FaceProfileView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        enrolledAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        verificationMode:
          type: string
          enum:
          - SIMULATED_TEST
          - UNVERIFIED_LEGACY
    FaceEnrollmentState:
      type: object
      required:
      - memberId
      - profiles
      - enrollments
      properties:
        memberId:
          type: string
          format: uuid
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/FaceProfileView'
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/FaceEnrollment'
    CheckinRehearsalRequest:
      type: object
      required:
      - requestId
      - captureRef
      properties:
        requestId:
          type: string
          format: uuid
        captureRef:
          type: string
          format: uuid
      additionalProperties: false
    CheckinCoreResult:
      type: object
      required:
      - requestId
      - recognized
      - accessAllowed
      - attendanceCreated
      - memberId
      - attendanceId
      - checkedAt
      - checkedInAt
      - reason
      - replayed
      - simulatedIdentity
      - verificationMode
      properties:
        requestId:
          type: string
          format: uuid
        recognized:
          type: boolean
        accessAllowed:
          type: boolean
        attendanceCreated:
          type: boolean
        memberId:
          type: string
          format: uuid
          nullable: true
        attendanceId:
          type: string
          format: uuid
          nullable: true
        checkedAt:
          type: string
          format: date-time
          description: Server UTC, microsecond precision
        checkedInAt:
          type: string
          format: date-time
          description: Server UTC, microsecond precision
          nullable: true
        reason:
          type: string
          enum:
          - CHECKED_IN
          - DUPLICATE_WINDOW
          - REQUEST_REPLAY
          - REQUEST_PREVIOUSLY_DENIED
          - NO_MATCH
          - UNKNOWN_IDENTITY
          - FACE_PROFILE_INACTIVE
          - ACCOUNT_INACTIVE
          - MEMBERSHIP_INACTIVE
          - PAID_COVERAGE_MISSING
        replayed:
          type: boolean
        simulatedIdentity:
          type: boolean
          enum:
          - true
        verificationMode:
          type: string
          enum:
          - SIMULATED_TEST
    AttendanceReadDto:
      type: object
      required:
      - id
      - checkedInAt
      - source
      - kioskId
      - verificationMode
      properties:
        id:
          type: string
          format: uuid
        checkedInAt:
          type: string
          format: date-time
          description: Server UTC, microsecond precision
        source:
          type: string
          enum:
          - FACE
        kioskId:
          type: string
          nullable: true
        verificationMode:
          type: string
          enum:
          - SIMULATED_TEST
          - UNVERIFIED_LEGACY
    RenewalCreate:
      type: object
      required:
      - planId
      properties:
        planId: &renewalschema001
          type: string
          format: uuid
      additionalProperties: false
    SimulatorResultCommand:
      type: object
      required:
      - eventId
      - providerRef
      - amount
      - currency
      - status
      properties:
        eventId: *renewalschema001
        providerRef:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Must match snapshot VND or a controlled409 is recorded
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          - CANCELLED
      additionalProperties: false
    RenewalPaymentDto:
      type: object
      required:
      - id
      - requestId
      - memberId
      - membershipId
      - planId
      - planName
      - amount
      - durationDays
      - currency
      - provider
      - providerRef
      - status
      - fulfillmentStatus
      - reconciliationReason
      - periodId
      - periodStart
      - periodEnd
      - createdAt
      - processedAt
      properties:
        id: *renewalschema001
        requestId: *renewalschema001
        memberId: *renewalschema001
        membershipId: *renewalschema001
        planId: *renewalschema001
        planName:
          type: string
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          description: Exact decimal NUMERIC(12,2), not binary float
        durationDays:
          type: integer
          format: int32
          minimum: 1
        currency:
          type: string
          enum:
          - VND
        provider:
          type: string
          enum:
          - SIMULATOR
        providerRef:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
          - CANCELLED
        fulfillmentStatus:
          type: string
          enum:
          - NOT_APPLIED
          - APPLIED
          - RECONCILIATION_REQUIRED
        reconciliationReason:
          type: string
          nullable: true
        periodId:
          type: string
          format: uuid
          nullable: true
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        createdAt: &renewalschema003
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
    SimulatorResultDto:
      allOf:
      - $ref: '#/components/schemas/RenewalPaymentDto'
      - type: object
        required:
        - eventId
        - eventOutcome
        properties:
          eventId: *renewalschema001
          eventOutcome:
            type: string
    PaidPeriodDto:
      type: object
      required:
      - id
      - planId
      - planName
      - source
      - startDate
      - endDate
      - amount
      - durationDays
      - currency
      - paymentId
      - phase
      properties:
        id: *renewalschema001
        planId: *renewalschema001
        planName:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - LEGACY_AGGREGATE
          - INITIAL_COUNTER
          - RENEWAL
        startDate: &renewalschema002
          type: string
          format: date
        endDate: *renewalschema002
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          description: Exact decimal NUMERIC(12,2), not binary float
          nullable: true
        durationDays:
          type: integer
          format: int32
          nullable: true
        currency:
          type: string
          nullable: true
          enum:
          - VND
        paymentId:
          type: string
          format: uuid
          nullable: true
        phase:
          type: string
          enum:
          - CURRENT
          - NEXT
          - HISTORY
    MembershipPeriodsDto:
      type: object
      required:
      - membershipId
      - checkedAt
      - periods
      properties:
        membershipId: *renewalschema001
        checkedAt: *renewalschema003
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PaidPeriodDto'
    SimulatorEventTrace:
      type: object
      required:
      - id
      - eventId
      - reportedStatus
      - outcome
      - errorCode
      - httpStatus
      - actorUserId
      - checkedAt
      properties:
        id: *renewalschema001
        eventId: *renewalschema001
        reportedStatus:
          type: string
        outcome:
          type: string
        errorCode:
          type: string
          nullable: true
        httpStatus:
          type: integer
          enum:
          - 200
          - 409
        actorUserId: *renewalschema001
        checkedAt: *renewalschema003
    AccountCreate:
      type: object
      additionalProperties: false
      required: [email, fullName]
      properties:
        email: {type: string, format: email, maxLength: 255}
        fullName: {type: string, minLength: 1, maxLength: 150, description: Không blank; PostgreSQL VARCHAR150 codepoints}
    AccountResponse:
      type: object
      required: [userId, profileId, email, fullName, role, status, activationPending]
      properties:
        userId: {type: string, format: uuid}
        profileId: {type: string, format: uuid, description: Khác User UUID}
        email: {type: string, format: email}
        fullName: {type: string}
        role: {type: string, enum: [MEMBER, PT]}
        status: {type: string, enum: [ACTIVE, SUSPENDED, DISABLED]}
        activationPending: {type: boolean, description: Audit pending chưa activated và status DISABLED; không áp legacy tự động}
    ServiceEligibility:
      type: object
      additionalProperties: false
      required: [eligible, checkedAt, reasonCodes]
      properties:
        eligible:
          type: boolean
          description: true khi và chỉ khi reasonCodes rỗng
        checkedAt:
          type: string
          format: date-time
          description: Server Clock ISO-8601 UTC, thời điểm đánh giá snapshot hiện tại
        reasonCodes:
          type: array
          uniqueItems: true
          description: Thứ tự cố định như enum; MEMBERSHIP_NOT_COVERED chỉ khi membership hợp lệ hiện tại
          items:
            type: string
            enum: [BOOKING_NOT_CONFIRMED, SESSION_NOT_STARTED, SESSION_ENDED, MEMBER_ACCOUNT_INACTIVE, MEMBERSHIP_INACTIVE, MEMBERSHIP_NOT_COVERED]
    MembershipPlanCreate:
      type: object
      additionalProperties: false
      required: [name, durationDays, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Không blank; tối đa 100 Unicode code points, không chứa U+0000; giữ nguyên tên, không unique
        description:
          type: string
          nullable: true
          description: Tùy chọn hoặc null, TEXT PostgreSQL; không thêm business cap; không chứa U+0000
        durationDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: JSON integer lexical, không ép chuỗi hoặc float/exponent; đơn vị ngày
        price:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          description: JSON number, NUMERIC(12,2); quá 2 chữ số thập phân hoặc range bị từ chối, không làm tròn
    BookingPolicyWrite:
      type: object
      additionalProperties: false
      required: [maxAdvanceDays, minNoticeHours, cancelDeadlineHours, maxFutureBookings]
      properties:
        maxAdvanceDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        minNoticeHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        cancelDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        maxFutureBookings:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    BookingCreate:
      type: object
      required: [ptId, slotId]
      description: UUID theo schema; memberId/status ngoài DTO không được dùng để thay owner hoặc trạng thái
      properties:
        ptId:
          type: string
          format: uuid
          example: '22222222-2222-4222-8222-222222222222'
        slotId:
          type: string
          format: uuid
          example: '33333333-3333-4333-8333-333333333333'
    AvailabilityCreate:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2030-01-02T16:00:00+07:00'
          description: Có offset, sau now; tối đa microsecond, response UTC
        endAt:
          type: string
          format: date-time
          example: '2030-01-02T17:30:00+07:00'
          description: Chính xác 90 phút sau startAt theo thời lượng UTC
    AvailabilityPatch:
      type: object
      anyOf:
      - required: [startAt]
      - required: [endAt]
      description: Field thiếu giữ giá trị cũ; không nhận ptId/status để thay ownership hoặc trạng thái
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    BookingPolicy:
      type: object
      additionalProperties: false
      required:
      - id
      - maxAdvanceDays
      - minNoticeHours
      - cancelDeadlineHours
      - maxFutureBookings
      - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
        maxAdvanceDays:
          type: integer
          format: int32
          minimum: 1
          example: 14
          description: Khi áp vào booking sẽ tính bằng thời lượng ngày nhân 24 giờ, không phải ngày lịch
        minNoticeHours:
          type: integer
          format: int32
          minimum: 0
          example: 2
        cancelDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          example: 4
        maxFutureBookings:
          type: integer
          format: int32
          minimum: 1
          example: 5
        effectiveFrom:
          type: string
          format: date-time
          example: '2030-01-02T03:04:05.123456Z'
          description: UTC; bao gồm policy có effective_from đúng bằng now
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
    LoginResponse:
      type: object
      properties:
        accessToken: &id005
          type: string
        refreshToken: *id005
        role:
          type: string
          enum:
