components:
  responses:
    LifecycleValidation:
      description: ERR_VALIDATION, UUID/input không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleUnauthorized:
      description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc account không ACTIVE khi auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleForbidden:
      description: ERR_FORBIDDEN, sai role hoặc account không ACTIVE khi recheck
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LifecycleConflict:
      description: >-
        ERR_BOOKING_NOT_CONFIRMED cho request cũ/lặp, ERR_CANCELLATION_DEADLINE,
        ERR_PT_CANCELLATION_WINDOW_CLOSED, ERR_BOOKING_NOT_ENDED, ERR_BOOKING_SLOT_CONFLICT hoặc ERR_CONFLICT cho constraint/concurrency.
        Không thay metadata lần hai, không tác động slot thuộc booking CONFIRMED khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityValidation:
      description: ERR_VALIDATION, input/body/UUID/time sai hoặc duration khác 90 phút
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityUnauthorized:
      description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc tài khoản không còn ACTIVE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityForbidden:
      description: ERR_FORBIDDEN, ADMIN/MEMBER không có quyền PT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityNotFound:
      description: ERR_NOT_FOUND, thiếu profile PT hoặc slot không có/không thuộc PT đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityConflict:
      description: ERR_CONFLICT, overlap/BOOKED/CONFIRMED/slot không chỉnh được hoặc concurrent conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BookingPolicyWrite:
      type: object
      additionalProperties: false
      required: [maxAdvanceDays, minNoticeHours, cancelDeadlineHours, maxFutureBookings]
      properties:
        maxAdvanceDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        minNoticeHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        cancelDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        maxFutureBookings:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    BookingCreate:
      type: object
      required: [ptId, slotId]
      description: UUID theo schema; memberId/status ngoài DTO không được dùng để thay owner hoặc trạng thái
      properties:
        ptId:
          type: string
          format: uuid
          example: '22222222-2222-4222-8222-222222222222'
        slotId:
          type: string
          format: uuid
          example: '33333333-3333-4333-8333-333333333333'
    AvailabilityCreate:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2030-01-02T16:00:00+07:00'
          description: Có offset, sau now; tối đa microsecond, response UTC
        endAt:
          type: string
          format: date-time
          example: '2030-01-02T17:30:00+07:00'
          description: Chính xác 90 phút sau startAt theo thời lượng UTC
    AvailabilityPatch:
      type: object
      anyOf:
      - required: [startAt]
      - required: [endAt]
      description: Field thiếu giữ giá trị cũ; không nhận ptId/status để thay ownership hoặc trạng thái
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    BookingPolicy:
      type: object
      additionalProperties: false
      required:
      - id
      - maxAdvanceDays
      - minNoticeHours
      - cancelDeadlineHours
      - maxFutureBookings
      - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
        maxAdvanceDays:
          type: integer
          format: int32
          minimum: 1
          example: 14
          description: Khi áp vào booking sẽ tính bằng thời lượng ngày nhân 24 giờ, không phải ngày lịch
        minNoticeHours:
          type: integer
          format: int32
          minimum: 0
          example: 2
        cancelDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          example: 4
        maxFutureBookings:
          type: integer
          format: int32
          minimum: 1
          example: 5
        effectiveFrom:
          type: string
          format: date-time
          example: '2030-01-02T03:04:05.123456Z'
          description: UTC; bao gồm policy có effective_from đúng bằng now
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
    LoginResponse:
      type: object
      properties:
        accessToken: &id005
          type: string
        refreshToken: *id005
        role:
          type: string
          enum:
          - MEMBER
          - PT
          - ADMIN
    Plan:
      type: object
      properties:
        id: *id001
        name: *id005
        description:
          type: string
          nullable: true
        durationDays:
          type: integer
        price:
          type: number
    Membership:
      type: object
      properties:
        id: *id001
        planId: *id001
        planName: *id005
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - SUSPENDED
          - EXPIRED
          - CANCELLED
    Trainer:
      type: object
      properties:
        id: *id001
        fullName: *id005
        bio:
          type: string
          nullable: true
        specialization:
          type: string
          nullable: true
        experienceSummary:
          type: string
          nullable: true
    Slot:
      type: object
      required: [id, ptId, startAt, endAt, status]
      properties:
        id: *id001
        ptId: *id001
        startAt: *id002
        endAt: *id002
        status:
          type: string
          enum:
          - AVAILABLE
          - BOOKED
          - DISABLED
    Booking:
      type: object
      required: [id, memberId, ptId, slotId, startAt, endAt, status, cancelledBy, cancelReason, cancelledAt, completedAt]
      properties:
        id: *id001
        memberId: *id001
        ptId: *id001
        slotId: *id001
        startAt: *id002
        endAt: *id002
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - COMPLETED
        cancelledBy:
          type: string
          nullable: true
        cancelReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code: *id005
            message: *id005
            details:
              type: object
              additionalProperties: true
            correlationId: *id005
        timestamp: *id002
        status:
          type: integer
        message: *id005
