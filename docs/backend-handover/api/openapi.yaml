        '409':
          $ref: '#/components/responses/AvailabilityConflict'
    delete:
      operationId: disablePtAvailability
      summary: PT loại slot chưa booked khỏi khả năng đặt lịch
      description: >-
        Chuyển DISABLED, không xóa vật lý hoặc thay đổi booking lịch sử/FK.
        BOOKED hoặc gắn CONFIRMED trả 409. Lặp lại DISABLED không có CONFIRMED trả 204.
        GET PT không lọc status vẫn thấy lịch sử; GET MEMBER khả dụng loại slot DISABLED.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Đã DISABLED hoặc đã DISABLED từ trước; body rỗng
        '400':
          $ref: '#/components/responses/AvailabilityValidation'
        '401':
          $ref: '#/components/responses/AvailabilityUnauthorized'
        '403':
