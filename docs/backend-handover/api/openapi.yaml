      required: true
      schema:
        type: string
        format: uuid
  /api/v1/admin/members/{member}/face-enrollments/{operation}/complete:
    post:
      summary: Finalize sau server adapter READY; không client attestation
      description: HTTP200 có thể PENDING/ACTIVE/FAILED/REVOKED; phải đọc status. Retry cùng operation an toàn. External I/O
        ngoài transaction; rollback giữ PENDING và stage để reconcile. Chỉ ADMIN ACTIVE; default503; no-store. Profile face-enrollment-rehearsal
        trên DB riêng; SIMULATED_TEST, không camera/biometric/liveness.
      responses:
        '200':
          description: Server lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollment'
        '400':
          description: ERR_VALIDATION hoặc ERR_FACE_CONSENT_REQUIRED
        '401':
          description: ERR_UNAUTHORIZED
        '403':
          description: ERR_FORBIDDEN
        '404':
          description: ERR_NOT_FOUND
        '409':
          description: ERR_IDEMPOTENCY_KEY_REUSED / ERR_FACE_ENROLLMENT_PENDING / ERR_FACE_ENROLLMENT_CONFLICT / ERR_FACE_ENROLLMENT_NOT_PENDING
        '503':
          description: ERR_FACE_ENROLLMENT_UNAVAILABLE
      tags:
      - Face enrollment (guarded simulated test)
      security:
      - bearerAuth: []
    parameters:
    - in: path
      name: member
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: operation
      required: true
      schema:
        type: string
        format: uuid
  /api/v1/admin/members/{member}/face-enrollments/{operation}/revoke:
    post:
      summary: Hủy enrollment PENDING, giữ profile cũ; operation ID là idempotency
      responses:
        '200':
          description: REVOKED, metadata không đổi khi replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollment'
        '400':
          description: ERR_VALIDATION hoặc ERR_FACE_CONSENT_REQUIRED
        '401':
          description: ERR_UNAUTHORIZED
        '403':
          description: ERR_FORBIDDEN
