        required: true
        schema: *id001
      - &id003
        name: from
        in: query
        required: true
        schema: &id002
          type: string
          format: date-time
        description: ISO-8601 có offset; from < to; lọc startAt trong [from,to).
      - &id004
        name: to
        in: query
        required: true
