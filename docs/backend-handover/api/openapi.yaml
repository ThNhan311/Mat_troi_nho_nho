openapi: 3.0.3
info:
  title: FitCenter API — bản nháp cần review
  version: account-pt-activation-working-tree
  description: Baseline 1b1e323 có Booking/D01 và Web Member/PT/Admin Policy; M-01 thêm Admin tạo plan và đọc ACTIVE trên giao diện gốc. D01 snapshot không start marker, completion giữ R04. Admin account create/list thêm trên V1-V6; PT activation code được gate503 đến khi schema được thống nhất, chưa nghiệm thu activation PostgreSQL. Renewal/payment write chưa có.
servers:
- url: http://localhost:18081
paths:
  /api/v1/admin/members:
    get:
      operationId: listAdminMembers
      summary: ADMIN ACTIVE đọc Member accounts từ profiles thật
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Array, không hash hoặc credential
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccountResponse'}}
        '401': {$ref: '#/components/responses/LifecycleUnauthorized'}
        '403': {$ref: '#/components/responses/LifecycleForbidden'}
    post:
      operationId: createInactiveMemberAccount
      summary: ADMIN ACTIVE tạo User DISABLED + Member profile nguyên tử
      description: Không kích hoạt membership hoặc triển khai Member first activation. Role/UUID server; không nhận password/status/owner. Không replay POST chưa rõ kết quả.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCreate'}
      responses:
        '201':
          description: User/profile mới khác UUID, activationPending true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '400': {$ref: '#/components/responses/LifecycleValidation'}
        '401': {$ref: '#/components/responses/LifecycleUnauthorized'}
        '403': {$ref: '#/components/responses/LifecycleForbidden'}
        '409': {$ref: '#/components/responses/AccountConflict'}
  /api/v1/admin/personal-trainers:
    get:
      operationId: listAdminPersonalTrainers
      summary: ADMIN ACTIVE đọc PT accounts từ profiles thật
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Array AccountResponse, không credential
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccountResponse'}}
        '401': {$ref: '#/components/responses/LifecycleUnauthorized'}
        '403': {$ref: '#/components/responses/LifecycleForbidden'}
    post:
      operationId: createInactivePtAccount
      summary: ADMIN ACTIVE tạo User DISABLED + PT profile nguyên tử
      description: Tạo audit pending marker trong cùng transaction; không membership/payment. Không tự gửi OTP. Trùng email case insensitive409, không replay POST.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCreate'}
      responses:
        '201':
          description: PT DISABLED, activationPending true, UUID server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '400': {$ref: '#/components/responses/LifecycleValidation'}
        '401': {$ref: '#/components/responses/LifecycleUnauthorized'}
        '403': {$ref: '#/components/responses/LifecycleForbidden'}
        '409': {$ref: '#/components/responses/AccountConflict'}
  /api/v1/auth/pt-activation/request-otp:
    post:
      operationId: requestPtFirstActivationOtp
      summary: PT first activation — đang gate503 chờ schema thống nhất
      description: Public, không JWT. Khi được bật chỉ PT DISABLED có Admin pending audit; OTP5phút, resend>=60giây/max5lần giờ. Email không đủ điều kiện vẫn202 chung, không gửi mail. Adapter hiện chỉ loopback mail test @example.invalid. Không tự replay write.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        '202':
          description: Chỉ khi feature/schema được cho phép; không xác nhận email tồn tại
          headers:
            Cache-Control: {schema: {type: string}, example: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [message, expiresInSeconds, resendAfterSeconds]
                properties:
                  message: {type: string}
                  expiresInSeconds: {type: integer, enum: [300]}
                  resendAfterSeconds: {type: integer, enum: [60]}
        '400': {$ref: '#/components/responses/LifecycleValidation'}
        '429': {$ref: '#/components/responses/ActivationFailure'}
        '503': {$ref: '#/components/responses/ActivationFailure'}
  /api/v1/auth/pt-activation/verify-otp:
    post:
      operationId: verifyPtFirstActivationOtp
      summary: Tiêu thụ OTP, cấp grant đặt mật khẩu một lần — đang gate503
      description: OTP hết hạn khi now>=expiry; tối đa5attempts. Grant32byte random, hashSHA256 trong DB, TTL300s, không JWT. Chưa hoàn thành kích hoạt ở bước này.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: {type: string, format: email, maxLength: 255}
                otp: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
      responses:
        '200':
          description: Grant chỉ memory, không log/persist ở client
          headers:
            Cache-Control: {schema: {type: string}, example: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken, expiresInSeconds]
                properties:
                  verificationToken: {type: string, minLength: 43, maxLength: 43}
                  expiresInSeconds: {type: integer, enum: [300]}
        '400': {$ref: '#/components/responses/ActivationFailure'}
        '409': {$ref: '#/components/responses/ActivationFailure'}
        '429': {$ref: '#/components/responses/ActivationFailure'}
        '503': {$ref: '#/components/responses/ActivationFailure'}
  /api/v1/auth/pt-activation/password:
    post:
      operationId: completePtFirstActivationPassword
      summary: Tiêu thụ grant và đặt mật khẩu + ACTIVE nguyên tử — đang gate503
      description: Password>=8codepoints và<=72byteUTF8 theo BCrypt. User->activation row lock, Clock sau khóa; không JWT, không MEMBER flow. Không replay POST khi timeout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, password]
              properties:
                verificationToken: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
                password: {type: string, minLength: 8, writeOnly: true, description: Tối đa72byteUTF8, không silent truncation}
      responses:
        '200':
          description: Login email/password riêng sau kích hoạt, không accessToken
          headers:
            Cache-Control: {schema: {type: string}, example: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ACTIVE]}
        '400': {$ref: '#/components/responses/ActivationFailure'}
        '409': {$ref: '#/components/responses/ActivationFailure'}
        '503': {$ref: '#/components/responses/ActivationFailure'}
  /api/v1/admin/membership-plans:
    post:
      operationId: createMembershipPlan
      summary: ADMIN ACTIVE tạo gói tập ACTIVE và đọc lại qua GET hiện có
      description: >-
        UUID và trạng thái ACTIVE do server đặt. Không nhận ID/status/timestamps/owner hoặc field ngoài bốn input.
        Tên không unique; hai lệnh cùng tên có thể tạo hai UUID. durationDays là JSON integer int32, không chuỗi/float/exponent.
        price là JSON number đọc trực tiếp BigDecimal, không âm thầm làm tròn scale/range NUMERIC(12,2); giá 0 hợp lệ.
        Không đổi tháng thành ngày; không tạo/sửa Member, membership, payment hoặc booking.
        Transaction kiểm lại ADMIN ACTIVE từ principal và INSERT/flush; không khóa Member/PT/slot/policy.
        Không có idempotency key; client không tự replay POST khi timeout/kết quả chưa rõ, GET đối chiếu nhưng không nhận diện bằng tên.
        GET list/detail chỉ ACTIVE, không phải quản lý đầy đủ INACTIVE; update/status/delete chưa triển khai.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipPlanCreate'
      responses:
        '201':
          description: Gói ACTIVE mới; DTO giống GET, không có status/timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/LifecycleValidation'
        '401':
          $ref: '#/components/responses/LifecycleUnauthorized'
        '403':
          $ref: '#/components/responses/LifecycleForbidden'
        '409':
          description: ERR_CONFLICT khi constraint/lock conflict thực tế, không áp cho trùng tên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/pt/bookings/{id}/service-eligibility:
    get:
      operationId: getOwnBookingServiceEligibility
      summary: PT ACTIVE kiểm tra eligibility hiện tại của booking sở hữu
      description: >-
        Ownership từ principal/profile/booking, không nhận memberId/ptId để xác định chủ sở hữu.
        PT được phép truy cập nhận 200 kể cả không eligible. Chỉ đủ điều kiện khi CONFIRMED,
        startAt<=Clock.now<endAt, account Member ACTIVE và membership ACTIVE hiện tại/phủ toàn session.
        DATE theo Asia/Ho_Chi_Minh, expiry inclusive, end session đúng midnight sau expiry được phép.
        reasonCodes đầy đủ, không trùng, theo thứ tự enum; nhóm membership chỉ kiểm coverage nếu đang hợp lệ hiện tại.
        REPEATABLE_READ read-only, query không khóa hàng; một MVCC snapshot cho actor/booking/account/membership.
        checkedAt từ server Clock trong transaction, không chứng nhận dữ liệu không đổi sau response.
        Không đọc policy hoặc áp notice/advance/count/cancellation. Không mutation/cache, không lưu startedAt/startedBy.
        Completion giữ R04, không yêu cầu GET trước đó; chưa tuyên bố frontend chặn dịch vụ end-to-end.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Kết quả tại thời điểm checkedAt trên snapshot đọc, không có PII/membership details
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEligibility'
              example:
                eligible: false
                checkedAt: '2030-01-02T03:04:05.123456Z'
                reasonCodes: [MEMBERSHIP_INACTIVE]
        '400':
          description: ERR_VALIDATION, UUID sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: ERR_UNAUTHORIZED, không có token hợp lệ hoặc account không ACTIVE khi auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ERR_FORBIDDEN, sai role hoặc PT không ACTIVE trong service snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ERR_NOT_FOUND, booking/profile không tồn tại hoặc booking không thuộc PT đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/bookings/{id}/cancel:
    post:
      operationId: cancelOwnMemberBooking
      summary: MEMBER hủy booking CONFIRMED của chính mình
      description: >-
        Không yêu cầu membership ACTIVE. Policy R01 hiệu lực tại Clock now, không fallback.
        startAt-now >= cancelDeadlineHours, equality cho phép. CANCELLED với cancelledBy=MEMBER,
        cancelledAt=now, cancelReason/completedAt=null. Future slot AVAILABLE, startAt<=now DISABLED.
        Chỉ từ CONFIRMED; lặp lại 409 không đổi metadata hoặc slot sau rebooking.
        READ_COMMITTED; khóa Member -> PT -> slot -> booking, re-read sau khóa; mutation nguyên tử.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Booking CANCELLED; metadata UTC và slot đồng bộ
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Booking'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [CANCELLED]
        '400':
          $ref: '#/components/responses/LifecycleValidation'
        '401':
          $ref: '#/components/responses/LifecycleUnauthorized'
        '403':
          $ref: '#/components/responses/LifecycleForbidden'
        '404':
          description: ERR_NOT_FOUND khi thiếu profile/booking hoặc không sở hữu; BOOKING_POLICY_NOT_FOUND khi không có policy hiệu lực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
  /api/v1/pt/bookings/{id}/cancel:
    post:
      operationId: cancelOwnPtBooking
      summary: PT hủy booking CONFIRMED của chính mình trước startAt
      description: >-
        PT ACTIVE có profile sở hữu booking; identity từ principal, không tin actor trong body.
        Reason bắt buộc, không null/rỗng/chỉ whitespace kể cả Unicode; tối đa 500 Unicode code points,
        giữ nguyên văn. Clock now lấy sau chờ khóa Member -> PT -> slot -> booking và recheck.
        Chỉ now<startAt; bằng/sau startAt trả 409 ERR_PT_CANCELLATION_WINDOW_CLOSED.
        Không yêu cầu policy hoặc membership Member ACTIVE. CANCELLED, cancelledBy=PT,
        cancelledAt=now UTC, cancelReason=reason, completedAt=null; slot DISABLED không tự reopen.
        Request lặp terminal với reason hợp lệ trả 409 ERR_BOOKING_NOT_CONFIRMED, metadata bất biến;
        request cũ không tác động slot đã rebook. Hai rows cập nhật nguyên tử, rollback cùng nhau.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Phải có ký tự ngoài Unicode whitespace; lưu nguyên văn, không trim
            example:
              reason: Lịch PT thay đổi — dữ liệu tổng hợp
      responses:
        '200':
          description: Booking CANCELLED bởi PT, metadata UTC, slot DISABLED
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Booking'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [CANCELLED]
        '400':
          $ref: '#/components/responses/LifecycleValidation'
        '401':
          $ref: '#/components/responses/LifecycleUnauthorized'
        '403':
          $ref: '#/components/responses/LifecycleForbidden'
        '404':
          description: ERR_NOT_FOUND khi thiếu profile/booking hoặc không thuộc PT đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
  /api/v1/pt/bookings/{id}/complete:
    post:
      operationId: completeOwnPtBooking
      summary: PT hoàn thành booking CONFIRMED của chính mình
      description: >-
        Clock now>=endAt, equality hợp lệ; COMPLETED với completedAt=now UTC và metadata hủy null.
        Slot DISABLED, không mở lại slot đã qua. Không dùng membership/policy eligibility;
        completion không thay thế D01 service-start check. Lặp CANCELLED/COMPLETED trả 409,
        không đổi metadata lần hai. Khóa Member -> PT -> slot -> booking, mutation nguyên tử.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Booking COMPLETED, completedAt UTC, slot DISABLED
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Booking'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [COMPLETED]
        '400':
          $ref: '#/components/responses/LifecycleValidation'
        '401':
          $ref: '#/components/responses/LifecycleUnauthorized'
        '403':
          $ref: '#/components/responses/LifecycleForbidden'
        '404':
          description: ERR_NOT_FOUND khi thiếu profile/booking hoặc không thuộc PT đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
  /api/v1/bookings:
    post:
      operationId: createConfirmedBooking
      summary: MEMBER ACTIVE tạo booking auto-confirm
      description: >-
        Owner từ principal, không dùng memberId/status client. UUID ptId phải khớp slot.
        Membership ACTIVE hiện tại và bao phủ session theo DATE Việt Nam inclusive expiry.
        Slot AVAILABLE, không đổi version trong lúc chờ, dài 90 phút; PT ACTIVE.
        Policy R01 hiệu lực, không default; notice và advance có equality, ngày là thời lượng 24 giờ.
        Giới hạn CONFIRMED có start_at>now; không overlap Member/PT, tiếp giáp được phép.
        READ_COMMITTED; khóa Member -> membership -> PT -> slot; BOOKED + CONFIRMED nguyên tử.
        Response dùng id theo DTO hiện hữu, UTC. Không PENDING/REJECTED hoặc PT approval.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Booking CONFIRMED; slot BOOKED cùng transaction, không còn available
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Booking'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [CONFIRMED]
        '400':
          description: ERR_VALIDATION, thiếu/null/UUID/body sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc account không ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ERR_FORBIDDEN, ADMIN/PT hoặc Member không còn ACTIVE khi recheck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            ERR_NOT_FOUND cho Member profile/PT ACTIVE/slot không có hoặc cặp ptId-slotId không khớp.
            BOOKING_POLICY_NOT_FOUND khi thiếu policy hiệu lực, giữ nguyên contract R01.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            ERR_SLOT_NO_LONGER_AVAILABLE cho BOOKED/DISABLED/CONFIRMED hoặc đổi version lúc chờ;
            ERR_SLOT_INVALID_DURATION; ERR_MEMBERSHIP_INACTIVE; ERR_MEMBERSHIP_NOT_COVERED;
            ERR_BOOKING_NOTICE; ERR_BOOKING_ADVANCE; ERR_MAX_FUTURE_BOOKINGS; ERR_BOOKING_OVERLAP;
            ERR_CONFLICT cho constraint/lock/concurrency. Không retry mù; rollback BOOKED và booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/pt/availability:
    post:
      operationId: createPtAvailability
      summary: PT ACTIVE tạo slot Core 90 phút của chính mình
      description: >-
        startAt sau Clock.instant(), input có offset và tối đa microsecond.
        Không chồng slot chưa DISABLED hoặc session CONFIRMED cùng PT; tiếp giáp được phép.
        ptId/status client không được sử dụng. Response UTC. Không áp booking policy vào publication.
        Không thêm GET ở đường dẫn này; dùng GET /api/v1/pt/slots hiện có.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCreate'
      responses:
        '201':
          description: Slot AVAILABLE mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/AvailabilityValidation'
        '401':
          $ref: '#/components/responses/AvailabilityUnauthorized'
        '403':
          $ref: '#/components/responses/AvailabilityForbidden'
        '404':
          $ref: '#/components/responses/AvailabilityNotFound'
        '409':
          $ref: '#/components/responses/AvailabilityConflict'
  /api/v1/pt/availability/{slotId}:
    parameters:
    - name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updatePtAvailability
      summary: PT sửa slot AVAILABLE chưa bắt đầu của chính mình
      description: >-
        Không sửa BOOKED hoặc slot gắn CONFIRMED. Ít nhất một time field; field thiếu giữ giá trị cũ.
        Thời gian mới vẫn trong tương lai, duration 90 phút và không overlap.
        Không mở lại DISABLED hoặc slot đã qua. Nếu đổi giờ khi có lịch sử booking không CONFIRMED,
        DISABLED dòng cũ và tạo slot AVAILABLE thay thế trong một transaction; response trả ID MỚI.
        Booking lịch sử và FK giữ nguyên. Nếu chưa có booking, giữ ID. Không đổi thời điểm là no-op.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityPatch'
      responses:
        '200':
          description: Slot sau cập nhật hoặc slot thay thế; client dùng ID trong response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/AvailabilityValidation'
        '401':
          $ref: '#/components/responses/AvailabilityUnauthorized'
        '403':
          $ref: '#/components/responses/AvailabilityForbidden'
        '404':
          $ref: '#/components/responses/AvailabilityNotFound'
        '409':
          $ref: '#/components/responses/AvailabilityConflict'
    delete:
      operationId: disablePtAvailability
      summary: PT loại slot chưa booked khỏi khả năng đặt lịch
      description: >-
        Chuyển DISABLED, không xóa vật lý hoặc thay đổi booking lịch sử/FK.
        BOOKED hoặc gắn CONFIRMED trả 409. Lặp lại DISABLED không có CONFIRMED trả 204.
        GET PT không lọc status vẫn thấy lịch sử; GET MEMBER khả dụng loại slot DISABLED.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Đã DISABLED hoặc đã DISABLED từ trước; body rỗng
        '400':
          $ref: '#/components/responses/AvailabilityValidation'
        '401':
          $ref: '#/components/responses/AvailabilityUnauthorized'
        '403':
          $ref: '#/components/responses/AvailabilityForbidden'
        '404':
          $ref: '#/components/responses/AvailabilityNotFound'
        '409':
          $ref: '#/components/responses/AvailabilityConflict'
  /api/v1/admin/booking-policy:
    get:
      operationId: getEffectiveBookingPolicy
      summary: ADMIN đọc Booking Policy hiệu lực
      description: >-
        Chỉ đọc active=true và effective_from <= Clock.instant(), bao gồm equality.
        Không tự seed/cập nhật/fallback. effectiveFrom trả ISO-8601 UTC.
        Không có policy hiệu lực trả BOOKING_POLICY_NOT_FOUND.
        Lấy policy shared transaction lock rồi mới lấy Clock, chờ PUT commit/rollback để đọc bộ cấu hình nhất quán.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Policy hiệu lực; các giá trị lấy từ database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicy'
        '401':
          description: ERR_UNAUTHORIZED, chưa có access token hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ERR_FORBIDDEN, người dùng không có role ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: BOOKING_POLICY_NOT_FOUND, không có row active đã tới thời điểm hiệu lực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: BOOKING_POLICY_NOT_FOUND
                  message: Effective booking policy not found
                  details: {}
                  correlationId: synthetic-policy-request
                timestamp: '2030-01-02T03:04:05Z'
                status: 404
                message: Effective booking policy not found
        '409':
          description: ERR_CONFLICT khi lock timeout/concurrency, không retry tự động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: ERR_INTERNAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateImmediateBookingPolicy
      summary: ADMIN ACTIVE cấu hình Booking Policy có hiệu lực ngay
      description: >-
        Chỉ nhận đúng bốn giá trị integer, không coercion từ string/decimal; không nhận effectiveFrom,
        lịch tương lai/hồi tố hoặc field ngoài contract. Không thêm quan hệ giữa các giới hạn.
        Clock lấy sau policy exclusive transaction lock; effectiveFrom UTC truncate microseconds.
        UPDATE active tại chỗ giữ ID; chưa có active thì INSERT mới, kể cả bảng trống.
        Giữ nguyên inactive rows nhưng không lưu lịch sử các lần sửa active, không phải full versioning.
        Hai PUT tuần tự hóa bằng transaction advisory lock, last-write-wins theo thứ tự khóa/commit.
        GET và create/Member cancel dùng shared lock cùng key, không thấy nửa cập nhật.
        Không sửa booking/slot cũ hoặc tự hủy khi giảm giới hạn. Create tiếp theo dùng policy mới;
        Member cancel dùng deadline hiệu lực lúc yêu cầu hủy, kể cả booking tạo trước cập nhật.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPolicyWrite'
            example:
              maxAdvanceDays: 14
              minNoticeHours: 2
              cancelDeadlineHours: 4
              maxFutureBookings: 5
      responses:
        '200':
          description: Bộ cấu hình hiệu lực ngay, DTO sáu fields theo R01; không phải fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicy'
        '400':
          description: ERR_VALIDATION, thiếu/null/sai kiểu/ngoài miền INTEGER hoặc field ngoài contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: ERR_UNAUTHORIZED, thiếu token hoặc account không ACTIVE khi auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ERR_FORBIDDEN, sai role hoặc account không còn ACTIVE sau chờ khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ERR_CONFLICT cho constraint/concurrency/lock timeout; không SQL/stack trace, không retry mù
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
