  /api/v1/check-ins/face:
    post:
      operationId: checkinFromTrustedTestAdapter
      summary: Registered service/kiosk credential only; simulated identity rehearsal
      description: 'Default503. Guarded face-checkin-rehearsal JSON takes only opaque
        captureRef/requestId, never client memberId. Real multipart camera contract
        is deferred. HTTP200 does not imply access: read accessAllowed and reason. Within
        rolling30min (<last+30m) admission can be duplicate without insertion; exactly30min
        may insert. Replay never inserts and rechecks current eligibility; originally
        denied request remains denied. simulatedIdentity always true.'
      security:
      - checkinKioskId: []
        checkinKioskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRehearsalRequest'
      responses:
        '200':
          description: Core decision; CHECKED_IN, duplicate, replay or denial; not real
            Face authentication
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCoreResult'
        '400':
          description: ERR_VALIDATION; strict UUID/JSON, no owner/status/score injection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: ERR_UNAUTHORIZED; normal Member/Admin/PT JWT cannot act as kiosk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ERR_CHECKIN_REQUEST_REUSED or ERR_CHECKIN_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ERR_CHECKIN_UNAVAILABLE; no default fake recognition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/attendance/me:
    get:
      operationId: readOwnedAttendance
      summary: ACTIVE MEMBER reads own Attendance by principal members.id
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Inclusive instant, ISO8601 with offset
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Exclusive instant, must exceed from
      responses:
        '200':
          description: Own rows descending checkedInAt/id; empty array valid. V3 source
            FACE alone does not mean verified identity; check verificationMode.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceReadDto'
        '400':
          description: ERR_VALIDATION; invalid/missing range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid/inactive account token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or no ACTIVE Member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/memberships/{id}/renewals:
    post:
      operationId: initiateMembershipRenewal
      summary: MEMBER ACTIVE creates PENDING renewal; no date mutation
      description: Guarded renewal-integration-rehearsal only; default503. See M05/M06
        decision for payment/period/reconciliation semantics.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Same key/payload replays same transaction with latest state;
            snapshot never repriced
          headers:
            Cache-Control: &renewalpath001
              schema:
                type: string
                enum:
                - no-store
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewalPaymentDto'
        '400':
          description: Strict input/UUID/scale validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid/inactive-account token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong ACTIVE role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stable error.code; result mismatch/conflict traced without granting
            entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ERR_RENEWAL_UNAVAILABLE; feature gate off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created once, snapshot amount/duration, PENDING
          headers:
            Cache-Control: *renewalpath001
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewalPaymentDto'
      parameters:
      - name: id
        in: path
        required: true
        schema: &renewalpath002
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema: *renewalpath002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewalCreate'
