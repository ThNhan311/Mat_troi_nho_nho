        Không đổi tháng thành ngày; không tạo/sửa Member, membership, payment hoặc booking.
        Transaction kiểm lại ADMIN ACTIVE từ principal và INSERT/flush; không khóa Member/PT/slot/policy.
        Không có idempotency key; client không tự replay POST khi timeout/kết quả chưa rõ, GET đối chiếu nhưng không nhận diện bằng tên.
