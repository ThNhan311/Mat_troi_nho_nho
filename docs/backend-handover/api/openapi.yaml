components:
  responses:
    AvailabilityValidation:
      description: ERR_VALIDATION, input/body/UUID/time sai hoặc duration khác 90 phút
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityUnauthorized:
      description: ERR_UNAUTHORIZED, thiếu token hợp lệ hoặc tài khoản không còn ACTIVE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityForbidden:
      description: ERR_FORBIDDEN, ADMIN/MEMBER không có quyền PT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityNotFound:
      description: ERR_NOT_FOUND, thiếu profile PT hoặc slot không có/không thuộc PT đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityConflict:
      description: ERR_CONFLICT, overlap/BOOKED/CONFIRMED/slot không chỉnh được hoặc concurrent conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AvailabilityCreate:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2030-01-02T16:00:00+07:00'
          description: Có offset, sau now; tối đa microsecond, response UTC
        endAt:
          type: string
          format: date-time
          example: '2030-01-02T17:30:00+07:00'
          description: Chính xác 90 phút sau startAt theo thời lượng UTC
    AvailabilityPatch:
      type: object
      anyOf:
      - required: [startAt]
      - required: [endAt]
      description: Field thiếu giữ giá trị cũ; không nhận ptId/status để thay ownership hoặc trạng thái
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    BookingPolicy:
      type: object
      additionalProperties: false
      required:
      - id
      - maxAdvanceDays
      - minNoticeHours
      - cancelDeadlineHours
      - maxFutureBookings
      - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
        maxAdvanceDays:
          type: integer
          format: int32
          minimum: 1
          example: 14
          description: Khi áp vào booking sẽ tính bằng thời lượng ngày nhân 24 giờ, không phải ngày lịch
        minNoticeHours:
          type: integer
          format: int32
          minimum: 0
          example: 2
        cancelDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          example: 4
        maxFutureBookings:
          type: integer
          format: int32
          minimum: 1
          example: 5
        effectiveFrom:
          type: string
          format: date-time
          example: '2030-01-02T03:04:05.123456Z'
          description: UTC; bao gồm policy có effective_from đúng bằng now
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
    LoginResponse:
      type: object
      properties:
        accessToken: &id005
          type: string
        refreshToken: *id005
        role:
          type: string
          enum:
          - MEMBER
          - PT
          - ADMIN
    Plan:
      type: object
      properties:
        id: *id001
        name: *id005
        description:
          type: string
          nullable: true
        durationDays:
          type: integer
        price:
          type: number
    Membership:
      type: object
      properties:
